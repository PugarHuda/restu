<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
    <title>Restu</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <style>
      html, body {
        margin: 0; min-height: 100%;
        background: #232323; color: #E5E5E5;
        font: 15px/1.45 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        touch-action: manipulation; -webkit-text-size-adjust: 100%; overscroll-behavior: none;
      }
      main { padding: 20px 16px 32px; max-width: 520px; margin: 0 auto; }
      h1 { margin: 0; font-size: 22px; letter-spacing: .04em; }
      .sub { color: #A3A3A3; margin: 4px 0 14px; }
      #mirror {
        background: #0b0f0b; color: #7CFC8A; border-radius: 10px; padding: 12px;
        min-height: 180px; white-space: pre-wrap; font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace;
      }
      .row { display: flex; gap: 8px; margin: 12px 0; }
      .row button { flex: 1; }
      form { display: flex; gap: 8px; margin: 8px 0; }
      input { flex: 1; min-width: 0; padding: 10px; border-radius: 8px; border: 1px solid #404040; background: #171717; color: inherit; font: inherit; }
      button { padding: 10px 12px; border-radius: 8px; border: 0; background: #E5E5E5; color: #171717; font: inherit; font-weight: 600; }
      button.ghost { background: transparent; color: #A3A3A3; border: 1px solid #404040; width: 100%; margin-top: 12px; }
      #out { white-space: pre-wrap; }
      .toggle { display: flex; gap: 8px; align-items: flex-start; margin: 12px 0; color: #A3A3A3; }
      .toggle input { margin-top: 4px; }
    </style>
  </head>
  <body>
    <div id="app">Restu is starting...</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
