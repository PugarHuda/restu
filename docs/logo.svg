<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Restu: a pair of G2-style glasses; the right lens holds a check (consent given),
       the left lens a small queue of pending cards. Monochrome green like the G2 display. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#18211a"/>
      <stop offset="100%" stop-color="#0b0f0b"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g fill="none" stroke="#7CFC8A" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- temples -->
    <path d="M58 214 L34 196" stroke-width="18"/>
    <path d="M454 214 L478 196" stroke-width="18"/>
    <!-- lenses -->
    <rect x="58" y="176" width="168" height="150" rx="58" stroke-width="20"/>
    <rect x="286" y="176" width="168" height="150" rx="58" stroke-width="20"/>
    <!-- bridge -->
    <path d="M226 226 Q256 202 286 226" stroke-width="18"/>
    <!-- left lens: pending queue (three cards) -->
    <path d="M100 222 H184" stroke-width="14" opacity="0.95"/>
    <path d="M100 251 H168" stroke-width="14" opacity="0.65"/>
    <path d="M100 280 H150" stroke-width="14" opacity="0.4"/>
    <!-- right lens: consent check -->
    <path d="M322 252 L357 286 L420 214" stroke-width="22"/>
  </g>
  <!-- seal dot: the decision -->
  <circle cx="256" cy="392" r="16" fill="#7CFC8A" opacity="0.9"/>
  <path d="M196 392 H232 M280 392 H316" stroke="#7CFC8A" stroke-width="8" stroke-linecap="round" opacity="0.45"/>
</svg>
